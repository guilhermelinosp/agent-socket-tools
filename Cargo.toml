[package]
name = "agent-socket-tools"
version = "0.1.0"
edition = "2021"
description = "Minimal Unix Domain Socket protocol for local AI agent tool discovery and execution."
license = "MIT"

[[bin]]
name = "agent-tools-server"
path = "src/bin/agent-tools-server.rs"

[[bin]]
name = "agent-tools-client"
path = "src/bin/agent-tools-client.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
# Used only for a handful of justified, documented `unsafe` FFI calls:
# getuid()/umask() for the private-socket-directory hardening in
# transport.rs, and O_NOFOLLOW for filesystem_read.rs's symlink-swap
# mitigation. Not used anywhere else.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
